[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pipekit"
version = "0.1.0"
description = "Resumable pipelines of named steps: artifacts, composites, a manifest, listeners, recipes"
readme = "README.md"
license = "MIT"
authors = [{ name = "Duncan Campbell" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "pylint>=3.2"]

[project.scripts]
pipekit = "pipekit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pylint.main]
source-roots = ["src"]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",   # small strategy/listener classes are the point
    "too-many-arguments",
    "too-many-positional-arguments",
]
